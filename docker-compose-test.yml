services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ash_phoenix_starter_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  app_test:
    build:
      context: .
      target: test
    environment:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@db_test:5432/ash_phoenix_starter_test
    depends_on:
      db_test:
        condition: service_healthy
    command: sh -c "mix ecto.create --quiet && mix ecto.migrate --quiet && mix test"
