services:
  app:
    image: ${OCIR_REGION_KEY}.ocir.io/${OCIR_NAMESPACE}/${OCIR_REPO}:latest
    container_name: ash_phoenix_starter
    restart: unless-stopped

    # Required so Erlang EPMD (4369) and dist ports (9000-9100) bind directly
    # to the VM's private/Tailscale IP without Docker bridge NAT breaking libcluster
    network_mode: host

    env_file:
      - /etc/ash_phoenix_starter.env

    # Gives UsageTracker.terminate/2 plenty of time to flush pending bytes to Postgres
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-4000}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
